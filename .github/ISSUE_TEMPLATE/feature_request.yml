name: Website improvement
description: Propose a focused content, design, accessibility, or delivery improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What visitor or contributor problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Consider accessibility, performance, maintenance, privacy, and added surface.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the main Claude KISS discussions.
          required: true
        - label: This proposal keeps the site script-free and analytics-free, or explains why that principle should change.
          required: true
