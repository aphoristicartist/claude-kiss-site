name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check static source
        run: ./tests/test.sh

      - name: ShellCheck
        run: shellcheck build.sh scripts/render-og.sh tests/test.sh

      - name: Build release files
        run: ./build.sh

      - name: Check staged release
        run: ./tests/test.sh --built
